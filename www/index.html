<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>happy cooking!</title>
  <style>
    html {
      background: #FCF8EC;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.75rem;
      padding: 2.5rem 1.25rem;
      background: #FCF8EC;
      color: #3B3327;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      text-align: center;
    }

    img {
      display: block;
      width: min(420px, 100%);
      height: auto;
      border-radius: 14px;
      box-shadow: 0 12px 28px rgba(59, 51, 39, 0.15);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 7vw, 2.75rem);
      line-height: 1.2;
    }
  </style>
</head>
<body>
  <img src="https://image.web.id/images/masak-paus.md.jpg" alt="Masak paus">
  <h1>happy cooking!</h1>
</body>
</html>
