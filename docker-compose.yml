services:
  web:
    build: .                      # Selalu build dari Dockerfile lokal
    image: yllumi/httpd:latest    # Nama image hasil build
    container_name: static-web-server
    restart: unless-stopped
    ports:
      # Port 8080 di host sering sudah dipakai service lain, jadi default
      # di sini 8081. Ganti bila perlu.
      - "8081:80"                 # Port host : Port container
    volumes:
      # Workdir /www di-mount ke named volume, bukan ke folder host.
      # Image sengaja kosong, jadi isi volume TIDAK di-seed dari image:
      # masukkan konten sendiri (lihat README).
      # PERINGATAN: `docker compose down -v` menghapus volume + isinya.
      - www_data:/www
      # Alternatif bind mount, kalau ingin edit file dari host secara live
      # (buat folder htdocs/ berisi index.html lebih dulu):
      # - ./htdocs:/www:ro

volumes:
  www_data:
